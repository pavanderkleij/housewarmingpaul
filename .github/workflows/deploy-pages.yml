name: Publiceer housewarming op GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Haal repository op
        uses: actions/checkout@v6

      - name: Configureer GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Maak publiceerbare website
        shell: bash
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css script.js robots.txt .nojekyll _site/
          cp -R assets _site/assets
          sed -i "s|__SITE_URL__|${SITE_URL}|g" _site/index.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publiceer op GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
